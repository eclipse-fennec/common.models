bnd_version=7.2.1
bnd_snapshots=https://bndtools.jfrog.io/bndtools/libs-snapshot-local
org.gradle.jvmargs=-Xmx2048m

# Keep non-bundle root folders out of the bnd project graph. The bnd workspace
# plugin sweeps all root folders (except dot-folders, buildSrc, gradle) into the
# project graph, so the Gradle output dir and the documentation folders have to be
# excluded explicitly.
bnd_exclude=build,docs,docs-site
