name: Documentation

# Manual rebuild of the VitePress site. The snapshot/release workflows deploy the
# docs on every push to those branches; this is for re-deploying without a push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@5b25efac2c99c0f88252d1a45302b8a1ae5876ce # v1.4.0
