name: Documentation

# Manual rebuild of the VitePress site. The snapshot/release workflows deploy the
# docs on every push to those branches; this is for re-deploying without a push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# No workflow-level concurrency here, deliberately: the reusable's deploy job
# already serialises on the job-level group `pages`. Declaring the same group
# here makes the deploy job deadlock against its own run (eclipse-fennec/.github#35).

jobs:
  docs:
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@5b25efac2c99c0f88252d1a45302b8a1ae5876ce # v1.4.0
