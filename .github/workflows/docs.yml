name: Documentation

# Manual rebuild of the VitePress site. The snapshot/release workflows deploy the
# docs on every push to those branches; this is for re-deploying without a push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
